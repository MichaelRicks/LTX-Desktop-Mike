<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #canvas-host {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas-host.dragging { cursor: grabbing; }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="canvas-host"></div>
  <script src="lib/three.min.js"></script>
  <script src="viewer.js?v=2"></script>
</body>
</html>
